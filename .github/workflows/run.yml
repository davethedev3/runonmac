name: run
run-name: run on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      command:
        description: Bash script, age-encrypted (armored) to runner.pub
        required: true
        type: string
      runner:
        description: Runner image (standard labels only; these are free on public repos)
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-26
          - macos-26-intel
          - macos-15
          - macos-15-intel
          - macos-14
          - xcode-27
      repository:
        description: Public repo to check out as the workspace (owner/name); empty for this repo
        type: string
        default: ''
      ref:
        description: Branch, tag or SHA to check out; empty for the default branch
        type: string
        default: ''
      artifacts:
        description: Newline-separated paths or globs to return, age-encrypted (armored) to runner.pub
        required: true
        type: string
      recipient:
        description: age recipient that the log and returned files are encrypted to
        required: true
        type: string
      timeout:
        description: Command timeout in minutes (max 350)
        type: number
        default: 60
      stream:
        description: Live-log URL, age-encrypted (armored) to runner.pub; empty for none
        type: string
        default: ''

permissions:
  contents: read

env:
  AGE_VERSION: v1.3.2

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install age
        run: |
          case $(uname -m) in
            arm64)  arch=arm64 sha=e2020b073c44f692685a24d6abc378817eb81ffaaf49fd0531ef8565f767f2f5 ;;
            x86_64) arch=amd64 sha=1d1e4bc66e1427edad7739ae7616157de0e79db8b6d2a1497d7d9925fb06a539 ;;
          esac
          tgz=$RUNNER_TEMP/age.tar.gz
          curl -fsSL -o "$tgz" "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-darwin-$arch.tar.gz"
          echo "$sha  $tgz" | shasum -a 256 -c
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"

      # The only step that sees the runner key; it is deleted before the command runs.
      - name: Decrypt
        env:
          COMMAND: ${{ inputs.command }}
          ARTIFACTS: ${{ inputs.artifacts }}
          STREAM: ${{ inputs.stream }}
          RUNONMAC_KEY: ${{ secrets.RUNONMAC_KEY }}
        run: |
          key=$RUNNER_TEMP/key
          (umask 077; printf '%s\n' "$RUNONMAC_KEY" > "$key")
          age -d -i "$key" -o "$RUNNER_TEMP/command.sh" <<<"$COMMAND"
          age -d -i "$key" -o "$RUNNER_TEMP/artifacts" <<<"$ARTIFACTS"
          if [[ $STREAM ]]; then
            age -d -i "$key" -o "$RUNNER_TEMP/stream" <<<"$STREAM"
          fi
          if [[ -f .runonmac-payload.age ]]; then
            age -d -i "$key" .runonmac-payload.age | tar -x
            rm .runonmac-payload.age
          fi
          rm "$key"

      # Output goes only to a file, so the public log shows nothing but the exit code.
      # With a stream URL, a background sender also POSTs the file's new bytes,
      # age-encrypted to the recipient, to the CLI's tunnel; it is silenced too.
      - name: Run
        id: run
        timeout-minutes: ${{ fromJSON(inputs.timeout) }}
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          # The reply to each POST is the CLI's printed byte count, which becomes
          # the next offset. Stops once $3 exists and everything is sent, 15s
          # after $3, or at $3 if no send ever succeeded. Failures only delay it.
          stream() {
            set +e
            local url=$1 log=$2 done=$3 recipient=$4
            local off=0 size resp deadline='' ok='' max chunk=$RUNNER_TEMP/stream-chunk
            while :; do
              if [[ -e $done && ! $deadline ]]; then
                [[ $ok ]] || return 0
                deadline=$((SECONDS + 15))
              fi
              if [[ $deadline ]] && ((SECONDS >= deadline)); then return 0; fi
              size=$(wc -c < "$log")
              if ((size > off)); then
                tail -c +$((off + 1)) "$log" | head -c 1048576 | age -r "$recipient" > "$chunk"
                max=30
                [[ $deadline ]] && max=5
                if resp=$(curl -fsS -m "$max" -H 'Content-Type: application/octet-stream' \
                    --data-binary @"$chunk" "$url/$off") && [[ $resp =~ ^[0-9]+$ ]]; then
                  ok=1
                  if ((resp > off)); then off=$resp; continue; fi
                  off=$resp
                fi
                sleep 2
              elif [[ $deadline ]]; then
                return 0
              else
                sleep 1
              fi
            done
          }

          log=$RUNNER_TEMP/log
          : > "$log"
          recipient=$RECIPIENT
          unset RECIPIENT
          sender=''
          if [[ -s $RUNNER_TEMP/stream ]]; then
            stream "$(<"$RUNNER_TEMP/stream")" "$log" "$RUNNER_TEMP/done" "$recipient" \
              </dev/null >/dev/null 2>&1 &
            sender=$!
          fi
          status=0
          bash -eo pipefail "$RUNNER_TEMP/command.sh" >> "$log" 2>&1 || status=$?
          if [[ $sender ]]; then
            touch "$RUNNER_TEMP/done"
            wait "$sender" || true
          fi
          exit "$status"

      - name: Seal
        id: seal
        if: always() && steps.run.outcome != 'skipped'
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          out=$RUNNER_TEMP/output
          mkdir -p "$out"
          age -r "$RECIPIENT" -o "$out/log.age" "$RUNNER_TEMP/log"
          shopt -s nullglob
          IFS=$'\n'
          paths=()
          while read -r pattern; do
            # Unquoted on purpose: the pattern is glob-expanded (split on newlines only).
            # shellcheck disable=SC2206
            [[ $pattern ]] && paths+=($pattern)
          done < "$RUNNER_TEMP/artifacts"
          if ((${#paths[@]})); then
            tar --no-mac-metadata --no-xattrs -cf - -- "${paths[@]}" | age -r "$RECIPIENT" -o "$out/files.age"
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.seal.outcome == 'success'
        with:
          name: output
          path: ${{ runner.temp }}/output/
          retention-days: 7
          if-no-files-found: error
